version: "3"

services:
  mysql:
    image: mysql:9
    restart: always
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/mysqld
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: test
    ports:
      - "3306:3306"
  db-test:
    image: mysql:9
    restart: always
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/mysqld
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: test
    ports:
      - "3307:3306"